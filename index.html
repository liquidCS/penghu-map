<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <!-- meta -->
    <meta charset="utf-8">
    <meta name="author" content="LiquidCS">
    <title>澎湖</title>
  </head>
  <body>
    <div id="map"></div>
    <div id="legend" style="position: absolute; bottom: 20px; left: 20px; background-color: white; padding: 10px; border-radius: 5px; z-index: 1000;">
      <h3>Classification Legend</h3>
      <div class="legend-item">
        <span class="legend-color-box" style="background-color: red;"></span>
        AnnualCrop
      </div>
      <div class="legend-item">
        <span class="legend-color-box" style="background-color: orange;"></span>
        Forest
      </div>
      <div class="legend-item">
        <span class="legend-color-box" style="background-color: yellow;"></span>
        HerbaceousVegetation
      </div>
      <div class="legend-item">
        <span class="legend-color-box" style="background-color: green;"></span>
        Highway
      </div>
      <div class="legend-item">
        <span class="legend-color-box" style="background-color: blue;"></span>
        Industrial
      </div>
      <div class="legend-item">
        <span class="legend-color-box" style="background-color: white; border: 1px solid black;"></span>
        Pasture
      </div>
      <div class="legend-item">
        <span class="legend-color-box" style="background-color: purple;"></span>
        PermanentCrop
      </div>
      <div class="legend-item">
        <span class="legend-color-box" style="background-color: black;"></span>
        Residential
      </div>
      <div class="legend-item">
        <span class="legend-color-box" style="background-color: brown;"></span>
        River
      </div>
      <div class="legend-item">
        <span class="legend-color-box" style="background-color: aqua;"></span>
       	Sealake 
      </div>
    </div>
  </body>

  <script type="module" src="src/main.js"></script> 
</html>
